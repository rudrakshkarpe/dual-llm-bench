[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dual-llm-bench"
version = "0.1.1"
description = "Benchmark prompt-injection resilience and tool safety for dual-LLM agent architectures."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [
  { name = "Rudraksh Karpe", email = "rudraksh@simplismart.tech" }
]
keywords = [
  "ai-agents",
  "llm-security",
  "prompt-injection",
  "benchmarking",
  "evaluation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "build>=1.2,<2",
  "twine>=5,<7",
]

[project.scripts]
dual-llm-bench = "dual_llm_bench.cli:app"

[project.urls]
Homepage = "https://github.com/rudrakshkarpe/dual-llm-bench"
Issues = "https://github.com/rudrakshkarpe/dual-llm-bench/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dual_llm_bench"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dual_llm_bench"]
